<html>
<head>
    <title>svg</title>
</head>
<body>
    <svg id="mysvg"height="1000"width="1000" style="border:1 px solid">
        <rect x="100"y="100"height="100" width="100" fill="aqua" stroke="black" stroke-width="2">
        <animate attributename="x" from="100" to="500" dur="2s"begin="2s"fill="freeze"/>
        <animate attributename="stroke-width" from="2" to="6" dur="2s" begin="2s"fill="freeze"/>
        <animate attributename="fill" from="aqua" to="red" dur="2s"begin="2s" fill="freeze"/>
        </rect>
    </svg>
</body>
</html>
