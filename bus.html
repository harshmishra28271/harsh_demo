<html>
<head>
    <title>svg bus</title>
</head>
<body>
    <svg id="mysvg" width="900" height="400"style=border:1px solid>
    <g id="bus">
    <rect x="50" y="100"width="750" height="160"rx="25"ry="25" fill="orange"stroke="black" stroke-width="4"/>

    <rect x="180" y="80" width="220" height="30"rx="15"  fill="orange" stroke="black" stroke-width="3"/>
    
    <rect x="90" y="125" width="90" height="60"rx="10" fill="lightblue" stroke="black"/>
    <rect x="200" y="125" width="90" height="60"rx="10" fill="lightblue" stroke="black"/>
    <rect x="310" y="125" width="90" height="60"rx="10" fill="lightblue" stroke="black"/>
    <rect x="420" y="125" width="90" height="60"rx="10" fill="lightblue" stroke="black"/>
    <rect x="530" y="125" width="90" height="60"rx="10" fill="lightblue" stroke="black"/>


    <rect x="620" y="120" width="40" height="100"fill="lightskyblue" stroke="black" stroke-width="3"/>

    <rect x="690"y="120"width="40"height="100"fill="lightskyblue" stroke="black" stroke-width="3"/>

    <path d="M740 125 Q790 125  790 180   Q790 220 740 220 Z"fill="lightskyblue" stroke="black"stroke-width="3"/>


    <circle cx="250" cy="280" r="40" fill="black"/>
    <circle cx="250" cy="280" r="18" fill="lightgray"/>
    <circle cx="700" cy="280" r="40" fill="black"/>
    <circle cx="700" cy="280" r="18" fill="lightgray"/>
    
    
    
    <!--head light-->
    <rect x="790" y="175" width="18" height="18"rx="3"fill="white"stroke="black"/>
    

    <!--tail light-->
    <rect x="50" y="170" width="15"height="20"fill="red"/>
    <rect x="50" y="215" width="20"height="30"fill="red"/>

   </animate> 

    <text x="250" y="225" font-size="50"font-weight="bold"fill="white">BUS</text> 
    </g>

    
   </svg>
<script>
    let bus=document.getElementsById("bus");
    let x=0;
    let direction=1;
    function moveBus(){
        x+=direction*2;
        if(x>=400){
            direction=-1;
        }
        if(x<=0){
            direction=1;

        }
        
        bus.setAttribute(
            "transform",
            translate(${x},0)
        );
        requestAnimationFrame(moveBus);
    }
        moveBus();
    

    
</script>

</body>
</html>
